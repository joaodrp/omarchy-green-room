name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Manifest matches the repo and the README
        run: python3 .github/check-manifest.py

      - name: Camera resolution
        run: node --test .github/test-devices.mjs

      - name: Snapshot notification
        run: node --test .github/test-snapshot.mjs

      # QML is not linted here: qmllint needs Qt 6 plus Quickshell's own types
      # and Omarchy's shell on the import path, none of which exist on a runner.
      # CONTRIBUTING.md has the command to run locally.
